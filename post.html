<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script></head><body>
<main class="wrap"><article id="a" style="padding:32px 0"></article><a class="btn noprint" href="blog.html">← Todos os posts</a></main>
<script src="posts.js"></script><script src="layout.js"></script><script>
dados.then(() => {

const p = visiveis.find(x => x.id === qs.get('id'));
document.getElementById('a').innerHTML = p
  ? `<span class="tag">${p.tipo === 'pratica' ? 'Na prática' : 'Estudo'}</span><span class="meta">${fmt(p.data)}</span><h1>${p.titulo}</h1>${p.temas.map(t => `<span class="chip">${t}</span>`).join('')}${marked.parse(p.md || '')}`
  : '<h1>Post não encontrado</h1>';
if (p) document.title = p.titulo;

});
</script></body></html>
