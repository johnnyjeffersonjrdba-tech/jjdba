<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="Consolas, 'JetBrains Mono', monospace">
  <rect width="1200" height="580" rx="16" fill="#0b0f0c"/>
  <text x="40" y="54" font-size="26" font-weight="700" fill="#e6ede8">ADR — Automatic Diagnostic Repository</text>
  <text x="40" y="86" font-size="17" fill="#7f9686">Diretórios fora do banco: disponível mesmo com o banco parado</text>

  <g font-size="16">
    <text x="60" y="136" fill="#39ff88" font-weight="700">$ORACLE_BASE</text><text x="250" y="136" font-size="14" fill="#7f9686">← ADR base = DIAGNOSTIC_DEST</text>
    <text x="80" y="170" fill="#e6ede8">└── diag/</text>
    <text x="140" y="204" fill="#e6ede8">├── rdbms/cdbprd/cdbprd/</text><text x="470" y="204" font-size="14" fill="#ffb02e">← ADR home do banco</text>
    <text x="140" y="238" fill="#7f9686">├── tnslsnr/&lt;host&gt;/listener/</text>
    <text x="140" y="272" fill="#7f9686">└── asm/+asm/+asm/</text>
  </g>

  <rect x="40" y="300" width="1120" height="200" rx="12" fill="#121a15" stroke="#ffb02e" stroke-width="2"/>
  <text x="60" y="332" font-size="17" font-weight="700" fill="#ffb02e">Dentro do ADR home</text>
  <g font-size="15">
    <text x="60" y="370" fill="#39ff88">alert/</text><text x="200" y="370" fill="#e6ede8">log.xml — alert log em XML (oficial)</text>
    <text x="60" y="400" fill="#39ff88">trace/</text><text x="200" y="400" fill="#e6ede8">alert_cdbprd.log (texto) · cdbprd_ora_123.trc · cdbprd_lgwr_45.trc</text>
    <text x="60" y="430" fill="#39ff88">incident/</text><text x="200" y="430" fill="#e6ede8">incdir_&lt;id&gt; — dumps de cada incidente</text>
    <text x="60" y="460" fill="#39ff88">cdump/ hm/</text><text x="200" y="460" fill="#e6ede8">core files · relatórios do Health Monitor</text>
  </g>
  <rect x="40" y="516" width="1120" height="44" rx="10" fill="#0b0f0c" stroke="#1c2a21"/>
  <text x="64" y="544" font-size="15" fill="#e6ede8">SELECT name, value FROM v$diag_info;   ·   adrci → show homes → set homepath → show alert -tail</text>
  <text x="1160" y="574" text-anchor="end" font-size="12" fill="#ffffff55">jj_dba</text>
</svg>
