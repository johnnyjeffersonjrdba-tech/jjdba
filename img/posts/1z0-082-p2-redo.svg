<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Consolas, 'JetBrains Mono', monospace">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker>
  <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f9686"/></marker></defs>
  <rect width="1200" height="620" rx="16" fill="#0b0f0c"/>
  <text x="40" y="54" font-size="26" font-weight="700" fill="#e6ede8">Online redo log: grupos, membros e log switch</text>
  <text x="40" y="86" font-size="17" fill="#7f9686">O LGWR grava em todos os membros do grupo CURRENT ao mesmo tempo; o uso é circular</text>

  <!-- LGWR -->
  <rect x="510" y="118" width="180" height="56" rx="10" fill="#39ff88" fill-opacity=".15" stroke="#39ff88" stroke-width="2"/>
  <text x="600" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#39ff88">LGWR</text>
  <path d="M600 174 V214 H200 V236" fill="none" stroke="#39ff88" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- grupos -->
  <g font-size="15">
    <!-- grupo 1 current -->
    <rect x="60" y="240" width="300" height="230" rx="12" fill="#39ff88" fill-opacity=".07" stroke="#39ff88" stroke-width="2.5"/>
    <text x="80" y="272" font-size="18" font-weight="700" fill="#e6ede8">Grupo 1</text>
    <text x="340" y="272" text-anchor="end" font-weight="700" fill="#39ff88">CURRENT</text>
    <rect x="80" y="290" width="260" height="46" rx="8" fill="#121a15" stroke="#39ff88"/><text x="96" y="319" fill="#e6ede8">membro A  /disco1/redo01a</text>
    <rect x="80" y="346" width="260" height="46" rx="8" fill="#121a15" stroke="#39ff88"/><text x="96" y="375" fill="#e6ede8">membro B  /disco2/redo01b</text>
    <text x="80" y="428" fill="#b8c2bb">seq# 42 · sendo gravado agora</text>
    <!-- grupo 2 inactive (próximo) -->
    <rect x="450" y="240" width="300" height="230" rx="12" fill="#121a15" stroke="#5fd3ff" stroke-width="2"/>
    <text x="470" y="272" font-size="18" font-weight="700" fill="#e6ede8">Grupo 2</text>
    <text x="730" y="272" text-anchor="end" font-weight="700" fill="#5fd3ff">INACTIVE</text>
    <rect x="470" y="290" width="260" height="46" rx="8" fill="#0b0f0c" stroke="#7f9686"/><text x="486" y="319" fill="#b8c2bb">membro A  /disco1/redo02a</text>
    <rect x="470" y="346" width="260" height="46" rx="8" fill="#0b0f0c" stroke="#7f9686"/><text x="486" y="375" fill="#b8c2bb">membro B  /disco2/redo02b</text>
    <text x="470" y="428" fill="#b8c2bb">seq# 40 · próximo a ser usado</text>
    <text x="470" y="450" fill="#b8c2bb">(em ARCHIVELOG: após arquivar)</text>
    <!-- grupo 3 active -->
    <rect x="840" y="240" width="300" height="230" rx="12" fill="#121a15" stroke="#ffb02e" stroke-width="2"/>
    <text x="860" y="272" font-size="18" font-weight="700" fill="#e6ede8">Grupo 3</text>
    <text x="1120" y="272" text-anchor="end" font-weight="700" fill="#ffb02e">ACTIVE</text>
    <rect x="860" y="290" width="260" height="46" rx="8" fill="#0b0f0c" stroke="#7f9686"/><text x="876" y="319" fill="#b8c2bb">membro A  /disco1/redo03a</text>
    <rect x="860" y="346" width="260" height="46" rx="8" fill="#0b0f0c" stroke="#7f9686"/><text x="876" y="375" fill="#b8c2bb">membro B  /disco2/redo03b</text>
    <text x="860" y="428" fill="#b8c2bb">seq# 41 · ainda necessário</text>
    <text x="860" y="450" fill="#b8c2bb">para instance recovery</text>
  </g>
  <!-- ciclo -->
  <path d="M210 470 V505 H600 V476" fill="none" stroke="#39ff88" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#g)"/>
  <text x="600" y="540" text-anchor="middle" font-size="15" fill="#7f9686">próximo log switch: o LGWR passa para o grupo 2 · uso circular 1 → 2 → 3 → 1</text>
  <g font-size="14">
    <text x="40" y="584" fill="#e6ede8">• mínimo de 2 grupos · arquivo mínimo de 4 MB</text>
    <text x="620" y="584" fill="#e6ede8">• membros do mesmo grupo = cópias idênticas</text>
  </g>
  <text x="1160" y="610" text-anchor="end" font-size="13" fill="#ffffff55">jj_dba</text>
</svg>
