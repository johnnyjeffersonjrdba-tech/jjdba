<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escrever Post</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
.ed{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:860px){.ed{grid-template-columns:1fr}}
.ed label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.ed input,.ed select,.ed textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:15px Inter,sans-serif}
.ed textarea{font-family:"JetBrains Mono",monospace;font-size:14px;min-height:420px}
.tg{display:flex;flex-wrap:wrap;gap:6px}.tg label{margin:0;font-weight:500;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}.tg input{width:auto}
#out{min-height:120px;font-size:12px}
</style></head><body>
<main class="wrap wide"><section class="hero" style="padding-bottom:0"><span class="tag">Área do autor</span><h1>Escrever um post</h1><p>Preencha, confira a prévia ao lado e clique em <b>Gerar bloco</b>. Cole o bloco no topo da lista <code>POSTS</code> em <code>posts.js</code>. O rascunho fica salvo neste navegador enquanto você escreve.</p></section>
<div class="ed">
  <div>
    <label>Tipo</label><select id="tipo"><option value="pratica">Na prática (projeto real)</option><option value="estudo">Estudo (certificação)</option></select>
    <label>Modelo de estrutura</label><select id="modelo"><option value="">— manter texto atual —</option><option value="pratica">Projeto real: cenário, passo a passo, problemas, lições</option><option value="estudo">Estudo: conceitos, laboratório, pegadinhas, inglês</option><option value="erro">Erro resolvido: sintoma, causa, solução</option></select>
    <label>Título</label><input id="titulo">
    <label>Resumo (aparece na lista)</label><input id="resumo">
    <label>Temas</label><div class="tg" id="temas"></div>
    <label>Data de publicação</label><input id="data" type="date">
    <label>Série / parte (opcional, ex.: 1Z0-082 / 2)</label><div style="display:flex;gap:8px"><input id="serie" placeholder="1Z0-082"><input id="parte" type="number" placeholder="2" style="max-width:90px"></div>
    <label><input type="checkbox" id="rasc" style="width:auto"> Salvar como rascunho</label>
    <label>Conteúdo (Markdown)</label><textarea id="md"></textarea>
    <p><button class="btn" id="gerar" style="border:0;cursor:pointer">Gerar bloco</button> <button class="btn" id="copiar" style="border:0;cursor:pointer;background:var(--accent2)">Copiar</button></p>
    <textarea id="out" readonly></textarea>
  </div>
  <div><label>Prévia</label><article class="card" id="prev"></article></div>
</div></main>
<script src="posts.js"></script><script src="layout.js"></script><script>
const MODELOS = {
  pratica: '## Cenário\n- Origem:\n- Destino:\n- Objetivo:\n\n## Passo a passo\n### 1. \n```bash\n\n```\n### 2. \n\n## Problemas que encontrei e como resolvi\n\n## Lições aprendidas\n\n## Checklist\n- [ ] ',
  estudo: '## O que você vai aprender\n\n## Conceitos\n\n## Laboratório\n```sql\n\n```\n\n## Pegadinhas de prova\n\n## Inglês da prova\n| Termo | Significado |\n|---|---|\n| | |\n\n## Resumo em 5 linhas',
  erro: '## Sintoma\n```\nORA-\n```\n\n## Causa\n\n## Solução\n```sql\n\n```\n\n## Como evitar'
};
const $ = id => document.getElementById(id);
$('temas').innerHTML = TEMAS.map(t => `<label><input type="checkbox" value="${t}"> ${t}</label>`).join('');
$('data').value = hoje;
const campos = ['tipo', 'titulo', 'resumo', 'data', 'serie', 'parte', 'md'];
try { const r = JSON.parse(localStorage.getItem('rascunho-post') || '{}'); campos.forEach(c => r[c] != null && ($(c).value = r[c])); (r.temas || []).forEach(t => { const el = document.querySelector(`#temas input[value="${t}"]`); if (el) el.checked = true; }); } catch (e) {}
if (!$('md').value) $('md').value = MODELOS.pratica;
$('modelo').onchange = e => { if (e.target.value && confirm('Substituir o conteúdo pelo modelo?')) $('md').value = MODELOS[e.target.value]; e.target.value = ''; upd(); };
const temasSel = () => [...document.querySelectorAll('#temas input:checked')].map(i => i.value);
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function upd() {
  $('prev').innerHTML = `<span class="tag">${$('tipo').value === 'pratica' ? 'Na prática' : 'Estudo'}</span><h1>${$('titulo').value || 'Título'}</h1>${temasSel().map(t => `<span class="chip">${t}</span>`).join('')}${marked.parse($('md').value)}`;
  try { const r = {}; campos.forEach(c => r[c] = $(c).value); r.temas = temasSel(); localStorage.setItem('rascunho-post', JSON.stringify(r)); } catch (e) {}
}
document.querySelector('.ed').addEventListener('input', upd); upd();
$('gerar').onclick = () => {
  const o = { id: slug($('titulo').value), tipo: $('tipo').value, temas: temasSel(), data: $('data').value, titulo: $('titulo').value, resumo: $('resumo').value };
  if ($('serie').value) { o.serie = $('serie').value; o.parte = +$('parte').value || 1; }
  if ($('rasc').checked) o.rascunho = true;
  const md = $('md').value.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
  $('out').value = '  ' + JSON.stringify(o).replace(/}$/, '') + ',\n    "md": `' + md + '`\n  },';
};
$('copiar').onclick = () => { $('out').select(); navigator.clipboard?.writeText($('out').value); };
</script></body></html>
