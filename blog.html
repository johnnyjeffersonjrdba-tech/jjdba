<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artigos</title><link rel="stylesheet" href="style.css?v=202610142149">
<style>
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px}
.filtros a{border:1px solid var(--line);border-radius:6px;padding:5px 14px;font-size:13px;color:var(--ink)}
.filtros a span{color:var(--muted);margin-left:6px}
.filtros a:hover{border-color:var(--accent);text-decoration:none}
.filtros a.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}.filtros a.on span{color:var(--bg)}
.tema-ativo{font-size:13px;color:var(--muted);margin:-14px 0 22px}.tema-ativo b{color:var(--accent)}
</style></head><body>
<main class="wrap wide">
  <div class="layout">
    <section>
      <span class="tag">Artigos</span>
      <h1 style="margin:6px 0 8px;font-size:clamp(28px,4vw,40px)">Oracle na prova e na prática</h1>
      <p class="meta" style="margin:0 0 20px">Estudos para certificações e cenários práticos de DBA, em português e direto ao ponto.</p>
      <nav class="filtros" id="filtros"></nav>
      <p class="tema-ativo" id="temaAtivo" hidden></p>
      <div id="lista"></div>
    </section>
    <aside class="side">
      <div class="box"><input class="search" id="q" placeholder="Buscar artigos…"></div>
      <div class="box"><h4>Categorias</h4><div id="cats"></div></div>
      <div class="box"><h4>Trilhas de estudo</h4><a class="badge" href="trilhas.html" style="text-decoration:none;color:inherit"><div class="h">082</div><div><b>1Z0-082</b><br><span class="meta">tópicos da prova e artigos →</span></div></a></div>
    </aside>
  </div>
</main>
<script src="posts.js?v=202610142149"></script><script src="layout.js?v=202610142149"></script><script>
dados.then(() => {

const tipo = qs.get('tipo'), tema = qs.get('tema');
const extra = verRascunhos ? '&rascunhos' : '';
const url = (t, m) => 'blog.html?' + [t && 'tipo=' + t, m && 'tema=' + encodeURIComponent(m)].filter(Boolean).join('&') + extra;
const conta = t => visiveis.filter(p => (!t || p.tipo === t) && (!tema || p.temas.includes(tema))).length;
filtros.innerHTML = [['', 'Todos'], ['estudo', 'Estudos'], ['pratica', 'Na prática']]
  .map(([t, nome]) => `<a href="${url(t, tema)}" class="${(tipo || '') === t ? 'on' : ''}">${nome}<span>${conta(t)}</span></a>`).join('');
if (tema) { temaAtivo.hidden = false; temaAtivo.innerHTML = `Tema: <b>${tema}</b> · <a href="${url(tipo, '')}">limpar</a>`; }
let busca = '';
function render() {
  const lista = visiveis.filter(p => (!tipo || p.tipo === tipo) && (!tema || p.temas.includes(tema)) &&
    (p.titulo + p.resumo + p.temas.join(' ')).toLowerCase().includes(busca));
  document.getElementById('lista').innerHTML = lista.map(cardPost).join('') || `<div class="card"><p class="meta" style="margin:0">-- 0 rows selected. ${busca ? 'Nenhum artigo encontrado.' : 'O primeiro artigo desta seção sai em breve.'}</p></div>`;
}
document.getElementById('cats').innerHTML = TEMAS.map(t => { const n = visiveis.filter(p => p.temas.includes(t)).length; return `<a class="catl ${t === tema ? 'on' : ''}" href="${url(tipo, t === tema ? '' : t)}">${t}<span>${n}</span></a>`; }).join('');
q.oninput = e => { busca = e.target.value.toLowerCase(); render(); };
render();

});
</script></body></html>
